apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: status-page
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/SetGaming/status-page-project.git
    targetRevision: main
    path: status-page-chart

    helm:
      releaseName: status-page

  destination:
    server: https://kubernetes.default.svc
    namespace: status-page

  syncPolicy:
    automated:
      prune: false
      selfHeal: true

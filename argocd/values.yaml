global:
  logging:
    format: text
    level: info

controller:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

server:
  replicas: 1

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

repoServer:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

redis:
  enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

redis-ha:
  enabled: false

dex:
  enabled: false

applicationSet:
  replicas: 0

notifications:
  enabled: false

configs:
  cm:
    admin.enabled: true
    accounts.aviv: login
    accounts.neta: login

  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:status-page-deployer, applications, sync, default/status-page, allow
      g, aviv, role:status-page-deployer
      g, neta, role:status-page-deployer

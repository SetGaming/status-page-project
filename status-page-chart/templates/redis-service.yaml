{{- if .Values.redis.enabled }}

apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: {{ .Release.Namespace }}

  labels:
    {{- include "status-page.labels" . | nindent 4 }}

spec:
  clusterIP: None

  selector:
    {{- include "status-page.redisSelectorLabels" . | nindent 4 }}

  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP

{{- end }}

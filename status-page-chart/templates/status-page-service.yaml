apiVersion: v1
kind: Service

metadata:
  name: {{ include "status-page.fullname" . }}
  namespace: {{ .Release.Namespace }}

  labels:
    {{- include "status-page.labels" . | nindent 4 }}

spec:
  type: {{ .Values.statusPage.service.type }}

  selector:
    {{- include "status-page.appSelectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.statusPage.service.port }}
      targetPort: http
      protocol: TCP

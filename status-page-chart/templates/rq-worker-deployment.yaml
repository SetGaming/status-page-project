apiVersion: apps/v1
kind: Deployment

metadata:
  name: rq-worker
  namespace: {{ .Release.Namespace }}

  labels:
    {{- include "status-page.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.worker.replicaCount }}

  selector:
    matchLabels:
      {{- include "status-page.workerSelectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "status-page.workerSelectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: rq-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}

          {{- if .Values.redisHA.enabled }}
          env:
            - name: REDIS_SENTINELS
              value: {{ .Values.redisHA.sentinels | quote }}

            - name: REDIS_SENTINEL_SERVICE
              value: {{ .Values.redisHA.masterSet | quote }}

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redisHA.authSecret | quote }}
                  key: {{ .Values.redisHA.authSecretKey | quote }}
          {{- end }}

          command:
            - python
            - manage.py
            - rqworker

          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
